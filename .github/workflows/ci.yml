name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: surf
          POSTGRES_PASSWORD: surf
          POSTGRES_DB: surf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surf -d surf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://surf:surf@localhost:5432/surf
      DATABASE_URL_SYNC: postgresql+psycopg2://surf:surf@localhost:5432/surf
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests (no live network -- every upstream call is mocked from committed fixtures)
        run: pytest -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: web
        run: npm install

      - name: Build frontend (catches syntax/import errors -- no browser tests here)
        working-directory: web
        run: npm run build
