server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app with no client-side routing library (tab state only, no URL
    # routes) -- every path still resolves to index.html, harmless either way.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
